name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Endogen/web2api
          path: web2api-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './web2api-core[dev]'
      - run: ruff check recipes tests
      - run: pytest -q
