name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Endogen/web2api
          path: web2api-core
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.18"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --project web2api-core --extra dev --frozen
      - run: uv run --project web2api-core ruff check recipes tests
      - run: uv run --project web2api-core pytest -q
