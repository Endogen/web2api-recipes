name: Live recipe smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: live-recipe-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Endogen/web2api
          path: web2api-core
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --project web2api-core --extra dev --frozen
      - run: uv run --project web2api-core playwright install --with-deps chromium
      - run: uv run --project web2api-core pytest -m e2e -v --timeout=120
